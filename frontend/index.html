<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <!-- =========================
         Meta
    ========================== -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#05060d"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- =========================
         SEO
    ========================== -->
    <title>
      CCTV Recap AI | Surveillance Command Center
    </title>

    <meta
      name="description"
      content="Enterprise AI surveillance dashboard with cinematic incident recap, anomaly detection, live threat intelligence, and real-time monitoring."
    />

    <meta
      name="keywords"
      content="AI surveillance, CCTV AI, security dashboard, threat intelligence, motion detection, video analytics"
    />

    <meta
      name="author"
      content="CCTV Recap AI"
    />

    <!-- =========================
         Open Graph
    ========================== -->
    <meta
      property="og:title"
      content="CCTV Recap AI"
    />

    <meta
      property="og:description"
      content="Real-time surveillance intelligence and cinematic AI recap platform."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/og-image.png"
    />

    <!-- =========================
         Twitter
    ========================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="CCTV Recap AI"
    />

    <meta
      name="twitter:description"
      content="AI-powered surveillance intelligence platform."
    />

    <!-- =========================
         Favicon
    ========================== -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =========================
         Fonts
    ========================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- =========================
         Performance
    ========================== -->
    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//fonts.gstatic.com"
    />
  </head>

  <body class="bg-[#05060d] text-slate-100 antialiased">
    <!-- =========================
         React Root
    ========================== -->

    <div id="root"></div>

    <!-- =========================
         Entry
    ========================== -->

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
